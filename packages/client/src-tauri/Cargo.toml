[package]
name = "git-yak"
version = "2.3.0"
edition = "2021"
# authors become the Maintainer and homepage the Homepage of the Linux .deb
authors = ["Jakub Záruba"]
homepage = "https://gityak.com"

[lib]
name = "git_yak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "git-yak"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-app .deb update on Linux (deb_update.rs). Plain dependencies so the module and its tests
# build on every OS; only the commands are Linux-only. rustls: no system OpenSSL needed.
ureq = { version = "2", default-features = false, features = ["tls"] }
minisign-verify = "0.2"
base64 = "0.22"
# getuid() for the per-user update download folder.
libc = "0.2"

# macOS/Windows update through the official updater (Linux uses deb_update.rs); desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
