# Tauri 1 shell of GitYak for Linux distributions without webkit2gtk-4.1, which Tauri 2 needs
# (Ubuntu 20.04). It serves the same frontend, built with `vite build --mode tauri-v1`, and
# shares its commands with the Tauri 2 shell through src-tauri/src/shared_commands.rs.
[package]
name = "git-yak"
version = "2.1.2"
edition = "2021"

[[bin]]
name = "git-yak"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["shell-execute", "shell-open", "path-all", "window-all"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri build`: serves the bundled frontend instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
