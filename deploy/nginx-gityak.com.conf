# /etc/nginx/sites-available/gityak.com - the website and the release downloads.
# Copy of the live file on the server. The TLS listeners and the http → https redirects were
# added by `certbot --nginx -d gityak.com -d www.gityak.com --redirect`; the certificate is
# renewed by certbot.timer.

# Installer downloads get a log of their own, read by `yarn downloads` (scripts/downloads.ts):
# one tab-separated line per request, with the visitor's address cut to its network (the last
# part dropped). Rotated monthly and kept by /etc/logrotate.d/gityak (deploy/logrotate-gityak).
map $remote_addr $gityak_network {
    "~^(?<net>\d+\.\d+\.\d+)\.\d+$"                            $net.0;
    "~^(?<net>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):"        $net::;
    default                                                    -;
}

log_format gityak_downloads escape=json
    '$time_iso8601\t$request_method\t$status\t$body_bytes_sent\t$request_completion\t$http_range\t$uri\t$arg_src\t$arg_from\t$gityak_network\t$http_user_agent';

server {
    server_name www.gityak.com;
    return 301 https://gityak.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gityak.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gityak.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name gityak.com;

    root /var/www/gityak.com/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Published by .github/workflows/release.yml.
    location /releases/ {
        alias /var/www/gityak.com/releases/;

        # Read by the website and by the desktop app's update check, whose webview origin
        # (tauri://localhost, http://tauri.localhost) differs from the site's.
        location ~ \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
        }

        location ~ \.(dmg|exe|deb|tar\.gz)$ {
            access_log /var/log/gityak/downloads.log gityak_downloads;
            access_log /var/log/nginx/access.log;
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gityak.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gityak.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = gityak.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name gityak.com;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}

server {
    if ($host = www.gityak.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.gityak.com;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
