# /etc/nginx/sites-available/gityak.com — the website and the release downloads.
# certbot --nginx adds the TLS listeners and the http → https redirect to this file.

server {
    server_name www.gityak.com;
    listen 80;
    listen [::]:80;
    return 301 https://gityak.com$request_uri;
}

server {
    server_name gityak.com;
    listen 80;
    listen [::]:80;

    root /var/www/gityak.com/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Published by .github/workflows/release.yml.
    location /releases/ {
        alias /var/www/gityak.com/releases/;

        # Read by the website and by the desktop app's update check, whose webview origin
        # (tauri://localhost, http://tauri.localhost) differs from the site's.
        location ~ \.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache" always;
        }

        location ~ \.(dmg|exe|deb)$ {
            add_header Content-Disposition "attachment" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
