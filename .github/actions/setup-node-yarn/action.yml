name: Node + Yarn
description: Node.js with the Yarn 4 release the lockfile was written by, and installed dependencies.
inputs:
  node-version:
    required: true
  yarn-version:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    # package.json pins no packageManager (a global Yarn 1 would refuse to run then), so the
    # Yarn version is activated explicitly. Node 22 bundles a current corepack; installing one
    # with npm -g fails on Windows (the bundled one's files are in the way).
    - shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        corepack enable
        corepack prepare "yarn@${{ inputs.yarn-version }}" --activate
        yarn --version
    - uses: actions/cache@v6
      with:
        path: ~/.yarn/berry/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-
    - shell: bash
      run: yarn install --immutable
