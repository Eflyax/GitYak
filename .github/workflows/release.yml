# Pushing a tag vX.Y.Z (created by `yarn release X.Y.Z`) builds the installers for every
# platform and publishes them to https://gityak.com/releases/, where the website and the
# app's update check read them. Run it by hand (workflow_dispatch) to build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not publish
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  YARN_VERSION: '4.17.1'
  DEPLOY_HOST: 85.255.6.155
  DEPLOY_USER: gityak-deploy
  DEPLOY_ROOT: /var/www/gityak.com

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn release check "$GITHUB_REF_NAME"
      - run: yarn verify

  remote-worker:
    name: Remote worker (linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/remote-worker-rs
      - run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path packages/remote-worker-rs/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: remote-worker
          path: packages/remote-worker-rs/target/x86_64-unknown-linux-musl/release/remote-worker-rs
          if-no-files-found: error

  desktop:
    name: ${{ matrix.platform }}
    needs: remote-worker
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 is an Apple Silicon runner; the Intel build is cross-compiled on it.
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            updater: true
            output: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
            updater: true
            output: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            updater: true
            output: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          # The .deb has no Tauri updater artifact; it is signed after the build (Sign .deb).
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            output: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Every installer job signs update files. Without the key (a fork, a missing secret) the
      # build would publish nothing the app can verify, so stop before the long build.
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; update files cannot be signed."
            exit 1
          fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: remote-worker
          path: packages/remote-worker/dist
      - run: mv packages/remote-worker/dist/remote-worker-rs packages/remote-worker/dist/remote-worker-linux-x64
      # Updater artifacts are switched on here only, so local builds keep working without the
      # key: macOS gets a signed GitYak.app.tar.gz (from the app bundle), Windows a .sig next to
      # the NSIS installer, which is itself the update.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          flags=()
          if [ "${{ matrix.updater }}" = "true" ]; then
            flags+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          yarn workspace @git-yak/client tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${flags[@]}"
      # installer/ holds only installers (GitHub release, website); the updater archives and all
      # signatures go to updater-files/, a separate artifact the publish job puts on the server.
      - name: Rename installer
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p installer updater-files/updater updater-files/signatures
          src=$(ls packages/client/src-tauri/${{ matrix.output }} | head -n 1)
          name=$(yarn bun run scripts/release/file-name.ts "$version" "${{ matrix.platform }}")
          cp "$src" "installer/$name"
          case "${{ matrix.platform }}" in
            macos-*)
              bundle="packages/client/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
              ls -l "$bundle" || true
              if ! test -f "$bundle/GitYak.app.tar.gz" || ! test -f "$bundle/GitYak.app.tar.gz.sig"; then
                echo "::error::The build made no signed updater archive ($bundle/GitYak.app.tar.gz + .sig)."
                exit 1
              fi
              updater=$(yarn bun run scripts/release/file-name.ts --updater "$version" "${{ matrix.platform }}")
              cp "$bundle/GitYak.app.tar.gz" "updater-files/updater/$updater"
              cp "$bundle/GitYak.app.tar.gz.sig" "updater-files/signatures/$updater.sig"
              ;;
            windows-*)
              ls -l "$(dirname "$src")"
              if ! test -f "$src.sig"; then
                echo "::error::The build made no updater signature for $src."
                exit 1
              fi
              cp "$src.sig" "updater-files/signatures/$name.sig"
              ;;
          esac
          ls -l installer
      # yarn workspace runs in packages/client, hence the absolute path.
      - name: Sign .deb
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in installer/*.deb; do
            yarn workspace @git-yak/client tauri signer sign "$PWD/$file"
            test -f "$file.sig"
            mv "$file.sig" updater-files/signatures/
          done
      - run: ls -lR updater-files
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.platform }}
          path: updater-files/
          if-no-files-found: error

  linux-focal:
    name: linux-x64-focal
    needs: remote-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every installer job signs update files. Without the key (a fork, a missing secret) the
      # build would publish nothing the app can verify, so stop before the long build.
      - name: Updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; update files cannot be signed."
            exit 1
          fi
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: remote-worker
          path: packages/remote-worker/dist
      - run: mv packages/remote-worker/dist/remote-worker-rs packages/remote-worker/dist/remote-worker-linux-x64
      - name: Build in ubuntu:20.04
        run: SKIP_REMOTE_WORKER=1 bash scripts/build-linux-focal.sh
      - name: Rename installer
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p installer
          cp "$(ls dist-linux/*.deb | head -n 1)" "installer/$(yarn bun run scripts/release/file-name.ts "$version" linux-x64-focal)"
          ls -l installer
      # Signed on the runner, not in the Docker build, so the key never enters the container.
      # yarn workspace runs in packages/client, hence the absolute path.
      - name: Sign .deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p updater-files/signatures
          for file in installer/*.deb; do
            yarn workspace @git-yak/client tauri signer sign "$PWD/$file"
            test -f "$file.sig"
            mv "$file.sig" updater-files/signatures/
          done
          ls -lR updater-files
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux-x64-focal
          path: installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: updater-linux-x64-focal
          path: updater-files/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, desktop, linux-focal]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # actions/checkout fetches the pushed tag as a lightweight ref; the release notes are
      # the annotated tag's message.
      - run: git fetch --force --tags origin
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release/assets
          merge-multiple: true
      # updater/ (macOS archives) and signatures/ (every installer and archive), kept out of
      # release/assets so they never reach the GitHub release or the website's asset list.
      - uses: actions/download-artifact@v8
        with:
          pattern: updater-*
          path: release/updater-files
          merge-multiple: true
      # A signing secret holding a valid but different key would sign everything "fine" and every
      # installed app would reject the update: publish only signatures the committed key accepts.
      - name: Verify signatures
        run: |
          yarn bun run scripts/release/verify-signatures.ts \
            --pubkey packages/client/src-tauri/updater.pub \
            --signatures release/updater-files/signatures \
            --files release/assets \
            --files release/updater-files/updater
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Manifests
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat $DEPLOY_ROOT/releases/index.json" > release/current-index.json \
            || rm -f release/current-index.json
          yarn bun run scripts/release/manifest.ts \
            --tag "$GITHUB_REF_NAME" \
            --assets release/assets \
            --index release/current-index.json \
            --signatures release/updater-files/signatures \
            --updater release/updater-files/updater \
            --out release/out
      - name: Upload to gityak.com
        run: |
          dest="$DEPLOY_USER@$DEPLOY_HOST"
          releases="$DEPLOY_ROOT/releases"
          rsync -a --chmod=D755,F644 release/assets/ release/updater-files/updater/ release/updater-files/signatures/ \
            "$dest:$releases/$GITHUB_REF_NAME/"
          # Installers, updater files and signatures first, then the manifests that point at
          # them; each manifest is swapped in with a rename, so readers never see half a file.
          # updater.json before latest.json: an app told about N+1 by latest.json must find N+1
          # in updater.json too.
          for manifest in updater.json index.json latest.json; do
            if [ -f "release/out/$manifest" ]; then
              rsync -a --chmod=F644 "release/out/$manifest" "$dest:$releases/.$manifest.tmp"
              ssh "$dest" "mv $releases/.$manifest.tmp $releases/$manifest"
            fi
          done
          # Installers of old releases (their notes stay in index.json). ssh -n: without it ssh
          # reads the rest of pruned.txt as its stdin and only the first tag is pruned.
          while read -r tag; do
            if [[ "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
              ssh -n "$dest" "rm -rf -- $releases/$tag"
            fi
          done < release/out/pruned.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/assets/* \
            --title "GitYak ${GITHUB_REF_NAME#v}" \
            --notes-file release/out/notes.md \
            "${flags[@]}"
