# Pushing a tag vX.Y.Z (created by `yarn release X.Y.Z`) builds the installers for every
# platform and publishes them to https://gityak.com/releases/, where the website and the
# app's update check read them. Run it by hand (workflow_dispatch) to build without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not publish
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  YARN_VERSION: '4.17.1'
  DEPLOY_HOST: 85.255.6.155
  DEPLOY_USER: gityak-deploy
  DEPLOY_ROOT: /var/www/gityak.com

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - name: Tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn release check "$GITHUB_REF_NAME"
      - run: yarn verify

  remote-worker:
    name: Remote worker (linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/remote-worker-rs
      - run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path packages/remote-worker-rs/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: remote-worker
          path: packages/remote-worker-rs/target/x86_64-unknown-linux-musl/release/remote-worker-rs
          if-no-files-found: error

  desktop:
    name: ${{ matrix.platform }}
    needs: remote-worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
            output: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            bundles: dmg
            output: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            output: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            output: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/client/src-tauri
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: remote-worker
          path: packages/remote-worker/dist
      - run: mv packages/remote-worker/dist/remote-worker-rs packages/remote-worker/dist/remote-worker-linux-x64
      - name: Build
        run: yarn workspace @git-yak/client tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Rename installer
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p installer
          src=$(ls packages/client/src-tauri/${{ matrix.output }} | head -n 1)
          name=$(yarn bun run scripts/release/file-name.ts "$version" "${{ matrix.platform }}")
          cp "$src" "installer/$name"
          ls -l installer
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: installer/*
          if-no-files-found: error

  linux-focal:
    name: linux-x64-focal
    needs: remote-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: remote-worker
          path: packages/remote-worker/dist
      - run: mv packages/remote-worker/dist/remote-worker-rs packages/remote-worker/dist/remote-worker-linux-x64
      - name: Build in ubuntu:20.04
        run: SKIP_REMOTE_WORKER=1 bash scripts/build-linux-focal.sh
      - name: Rename installer
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p installer
          cp "$(ls dist-linux/*.deb | head -n 1)" "installer/$(yarn bun run scripts/release/file-name.ts "$version" linux-x64-focal)"
          ls -l installer
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64-focal
          path: installer/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, desktop, linux-focal]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # actions/checkout fetches the pushed tag as a lightweight ref; the release notes are
      # the annotated tag's message.
      - run: git fetch --force --tags origin
      - uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ env.NODE_VERSION }}
          yarn-version: ${{ env.YARN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release/assets
          merge-multiple: true
      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Manifests
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat $DEPLOY_ROOT/releases/index.json" > release/current-index.json \
            || rm -f release/current-index.json
          yarn bun run scripts/release/manifest.ts \
            --tag "$GITHUB_REF_NAME" \
            --assets release/assets \
            --index release/current-index.json \
            --out release/out
      - name: Upload to gityak.com
        run: |
          dest="$DEPLOY_USER@$DEPLOY_HOST"
          releases="$DEPLOY_ROOT/releases"
          rsync -a --chmod=D755,F644 release/assets/ "$dest:$releases/$GITHUB_REF_NAME/"
          # Installers first, then the manifests that point at them; each manifest is swapped
          # in with a rename, so readers never see half a file.
          for manifest in index.json latest.json; do
            if [ -f "release/out/$manifest" ]; then
              rsync -a --chmod=F644 "release/out/$manifest" "$dest:$releases/.$manifest.tmp"
              ssh "$dest" "mv $releases/.$manifest.tmp $releases/$manifest"
            fi
          done
          # Installers of old releases (their notes stay in index.json).
          while read -r tag; do
            if [[ "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
              ssh "$dest" "rm -rf -- $releases/$tag"
            fi
          done < release/out/pruned.txt
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/assets/* \
            --title "GitYak ${GITHUB_REF_NAME#v}" \
            --notes-file release/out/notes.md \
            "${flags[@]}"
